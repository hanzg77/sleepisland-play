<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>夜间机关 · Kinetic Maze</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #03070a;
      --stage: #071015;
      --ink: #d8e5e9;
      --muted: rgba(216, 229, 233, 0.6);
      --panel: rgba(8, 18, 24, 0.88);
      --line: rgba(216, 229, 233, 0.14);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page);
    }

    body {
      min-height: 100svh;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", system-ui, sans-serif;
    }

    main {
      display: grid;
      width: 100%;
      height: 100svh;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }

    .stage {
      position: relative;
      width: min(calc((100svh - 24px) * 0.5625), calc(100vw - 24px));
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 1px solid rgba(216, 229, 233, 0.1);
      border-radius: clamp(14px, 2.4vw, 28px);
      background: var(--stage);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.62);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--stage);
      touch-action: none;
    }

    canvas.is-interactive { cursor: crosshair; }

    .meta {
      position: absolute;
      top: clamp(10px, 2vw, 20px);
      right: clamp(10px, 2vw, 20px);
      left: clamp(10px, 2vw, 20px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 34px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
      color: var(--muted);
      font-size: clamp(8px, 1.8vw, 12px);
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    .meta__seed {
      overflow: hidden;
      color: var(--ink);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chrome {
      position: absolute;
      right: clamp(14px, 3vw, 28px);
      bottom: clamp(18px, 4vw, 40px);
      left: clamp(14px, 3vw, 28px);
      display: grid;
      gap: 12px;
      justify-items: center;
      pointer-events: none;
    }

    .chrome__hint {
      color: var(--muted);
      font-size: clamp(10px, 2.2vw, 14px);
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    .start {
      min-width: min(62%, 320px);
      min-height: 54px;
      padding: 14px 32px;
      border: 1px solid rgba(216, 229, 233, 0.22);
      border-radius: 999px;
      appearance: none;
      color: #061015;
      background: var(--ink);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45), 0 0 0 6px rgba(216, 229, 233, 0.06);
      cursor: pointer;
      font: 700 clamp(14px, 3vw, 18px) / 1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      letter-spacing: 0.18em;
      pointer-events: auto;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .start:hover { box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 10px rgba(216, 229, 233, 0.08); }
    .start:active { transform: translateY(1px) scale(0.99); }

    .hint {
      position: absolute;
      right: 0;
      bottom: clamp(18px, 4vw, 40px);
      left: 0;
      color: var(--muted);
      font-size: clamp(10px, 2.2vw, 14px);
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    [hidden] { display: none !important; }

    @media (max-aspect-ratio: 9 / 16) {
      main { padding: 0; }
      .stage { width: 100vw; max-height: 100svh; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="1080 × 1920 几何机关 v4">
      <canvas id="kinetic-maze-v4" width="1080" height="1920" aria-label="亮起才演奏的几何机关"></canvas>
      <div class="meta" id="meta-bar" aria-live="polite" hidden>
        <span class="meta__seed" id="seed-label">Seed —</span>
        <span id="status-label">已就绪</span>
      </div>
      <div class="chrome" id="chrome">
        <p class="chrome__hint">手指或鼠标划过画面，机关会亮起并彼此唤醒</p>
        <button class="start" id="start-control" type="button">▶ 开始</button>
      </div>
      <p class="hint" id="hint-label" hidden>划过画面，点亮一批机关</p>
    </section>
  </main>
  <script src="./kinetic-maze-v4.js?v=43-ripple-t1"></script>
</body>
</html>
